<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My AI Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .chat-card {
      width: 100%;
      max-width: 600px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(83,74,183,0.12);
      display: flex;
      flex-direction: column;
      height: 92vh;
      max-height: 700px;
      overflow: hidden;
    }
    .chat-header {
      background: linear-gradient(135deg, #534AB7, #7F77DD);
      color: white;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .header-info h1 { font-size: 16px; font-weight: 600; }
    .header-info p  { font-size: 12px; opacity: 0.8; }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #4ade80; margin-left: auto;
      box-shadow: 0 0 6px #4ade80;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .msg {
      max-width: 82%;
      padding: 11px 15px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.6;
      word-break: break-word;
    }
    .bot  { background: #f1f0fc; color: #1a1a2e; border-bottom-left-radius: 4px; align-self: flex-start; }
    .user { background: #534AB7; color: white; border-bottom-right-radius: 4px; align-self: flex-end; }
    .error { background: #fff0f0; color: #cc3333; border: 1px solid #ffcccc; border-bottom-left-radius: 4px; align-self: flex-start; font-size: 13px; }
    .typing { color: #888; font-style: italic; }
    .input-area {
      padding: 12px 16px;
      border-top: 1px solid #eee;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    #user-input {
      flex: 1;
      padding: 10px 16px;
      border: 1.5px solid #e0deff;
      border-radius: 25px;
      font-size: 14px;
      outline: none;
      background: #f8f8ff;
      color: #1a1a2e;
      transition: border 0.2s;
    }
    #user-input:focus { border-color: #534AB7; }
    #send-btn {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: #534AB7;
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, transform 0.1s;
    }
    #send-btn:hover  { background: #3C3489; }
    #send-btn:active { transform: scale(0.93); }
    #send-btn svg { fill: white; width: 18px; height: 18px; }
    .suggestions {
      display: flex; flex-wrap: wrap; gap: 8px;
      padding: 0 16px 12px;
    }
    .chip {
      padding: 6px 13px;
      border: 1.5px solid #e0deff;
      border-radius: 20px;
      font-size: 12px;
      color: #534AB7;
      cursor: pointer;
      background: #f8f8ff;
      transition: background 0.2s;
    }
    .chip:hover { background: #eeedff; }
  </style>
</head>
<body>

<div class="chat-card">
  <div class="chat-header">
    <div class="avatar">✦</div>
    <div class="header-info">
      <h1>My AI Assistant</h1>      
    </div>
    <div class="dot"></div>
  </div>

  <div id="messages">
    <div class="msg bot">
      👋 Hi! I'm your free AI assistant.<br><br>
      Ask me anything — homework help, explanations, coding, writing, or just a chat!
    </div>
  </div>

  <div class="suggestions">
    <span class="chip" onclick="quickSend('Explain photosynthesis simply')">Explain photosynthesis</span>
    <span class="chip" onclick="quickSend('Help me write a short essay')">Help with essay</span>
    <span class="chip" onclick="quickSend('What is machine learning?')">What is ML?</span>
  </div>

  <div class="input-area">
    <input id="user-input" type="text" placeholder="Type your message..." />
    <button id="send-btn">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
  // ============================================
  // 🔑 PUT YOUR GEMINI API KEY HERE
  // ============================================
  const API_KEY = "AIzaSyBvd3gdhX8vBGmxKDDkqLQc-7cvrCC2USE";

  // ✅ Stable working model + version
const MODEL = "gemini-2.5-flash";

const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`;

  const SYSTEM_PROMPT = "You are a helpful, friendly assistant. Keep answers clear and short.";

  let history = [];

  function addMsg(role, html) {
    const box = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.innerHTML = html;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
    return div;
  }

  function quickSend(text) {
    document.getElementById('user-input').value = text;
    sendMessage();
  }

  async function sendMessage() {
    const input = document.getElementById('user-input');
    const text  = input.value.trim();
    if (!text) return;

    if (API_KEY === "YOUR_API_KEY_HERE") {
      addMsg('error', '⚠️ Add your API key first.');
      return;
    }

    addMsg('user', text);
    input.value = '';

    // 👉 Add system prompt once at start
    if (history.length === 0) {
      history.push({
        role: "user",
        parts: [{ text: SYSTEM_PROMPT }]
      });
    }

    // 👉 Add user message
    history.push({
      role: "user",
      parts: [{ text: text }]
    });

    const typing = addMsg('bot typing', '⏳ Thinking...');

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: history
        })
      });

      const data = await res.json();

      if (!res.ok || data.error) {
        const errMsg = data.error?.message || `HTTP ${res.status}`;
        typing.className = 'msg error';
        typing.innerHTML = `❌ ${errMsg}`;
        history.pop();
        return;
      }

      const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text;

      if (!reply) {
        typing.className = 'msg error';
        typing.innerHTML = '❌ Empty response';
        history.pop();
        return;
      }

      typing.className = 'msg bot';
      typing.innerHTML = reply.replace(/\n/g, '<br>');

      // 👉 Save bot response
      history.push({
        role: "model",
        parts: [{ text: reply }]
      });

    } catch (err) {
      typing.className = 'msg error';
      typing.innerHTML = `❌ Network error`;
      history.pop();
    }
  }

  document.getElementById('send-btn').onclick = sendMessage;
  document.getElementById('user-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') sendMessage();
  });
</script>
