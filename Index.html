<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Chat UI</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #e2e8f0;
}

.app {
  width: 100%;
  max-width: 900px;
  height: 90vh;
  display: grid;
  grid-template-columns: 260px 1fr;
  background: rgba(15, 23, 42, 0.9);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}

/* Sidebar */
.sidebar {
  background: rgba(30, 41, 59, 0.8);
  padding: 20px;
  border-right: 1px solid rgba(255,255,255,0.05);
}

.sidebar h2 {
  font-size: 16px;
  margin-bottom: 20px;
}

.new-chat {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: none;
  background: #6366f1;
  color: white;
  cursor: pointer;
  margin-bottom: 20px;
}

.history {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.history div {
  padding: 8px 10px;
  border-radius: 8px;
  background: rgba(255,255,255,0.05);
  cursor: pointer;
  font-size: 13px;
}

/* Chat */
.chat {
  display: flex;
  flex-direction: column;
}

.chat-header {
  padding: 16px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  font-weight: 500;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.msg {
  max-width: 70%;
  padding: 12px 16px;
  border-radius: 14px;
  font-size: 14px;
  line-height: 1.5;
}

.user {
  background: #6366f1;
  align-self: flex-end;
}

.bot {
  background: rgba(255,255,255,0.08);
  align-self: flex-start;
}

.typing {
  font-style: italic;
  opacity: 0.6;
}

.input-area {
  padding: 16px;
  border-top: 1px solid rgba(255,255,255,0.05);
  display: flex;
  gap: 10px;
}

input {
  flex: 1;
  padding: 12px 14px;
  border-radius: 10px;
  border: none;
  background: rgba(255,255,255,0.08);
  color: white;
}

button {
  padding: 10px 16px;
  border-radius: 10px;
  border: none;
  background: #6366f1;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #4f46e5;
}

</style>
</head>
<body>

<div class="app">
  <div class="sidebar">
    <h2>AI Assistant</h2>
    <button class="new-chat" onclick="newChat()">+ New Chat</button>
    <div class="history" id="history"></div>
  </div>

  <div class="chat">
    <div class="chat-header">Chat</div>

    <div class="messages" id="messages">
      <div class="msg bot">Hello 👋 Ask me anything.</div>
    </div>

    <div class="input-area">
      <input id="input" placeholder="Type a message..." />
      <button onclick="sendMsg()">Send</button>
    </div>
  </div>
</div>

<script>
  // ============================================
  // 🔑 PUT YOUR GEMINI API KEY HERE
  // ============================================
  const API_KEY = "AIzaSyBvd3gdhX8vBGmxKDDkqLQc-7cvrCC2USE";

  // ✅ Working model from your available list
  const MODEL = "gemini-2.5-flash";

  // ✅ Correct endpoint
  const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`;

  const SYSTEM_PROMPT = "You are a helpful, friendly assistant. Keep answers clear and short.";

  let chats = [];
  let currentChat = [];

  // ================================
  // Render Messages
  // ================================
  function renderMessages() {
    const box = document.getElementById('messages');
    box.innerHTML = '';

    currentChat.forEach(m => {
      const div = document.createElement('div');
      div.className = 'msg ' + m.role;
      div.innerHTML = m.text.replace(/\n/g, "<br>");
      box.appendChild(div);
    });

    box.scrollTop = box.scrollHeight;
  }

  // ================================
  // Send Message (MAIN FUNCTION)
  // ================================
  async function sendMsg() {
    const input = document.getElementById('input');
    const text = input.value.trim();
    if (!text) return;

    // Add user message
    currentChat.push({ role: 'user', text });
    input.value = '';
    renderMessages();

    // Typing indicator
    const box = document.getElementById('messages');
    const typing = document.createElement('div');
    typing.className = 'msg bot typing';
    typing.innerText = 'Thinking...';
    box.appendChild(typing);
    box.scrollTop = box.scrollHeight;

    try {
      // Prepare conversation for API
      let contents = [];

      // Inject system prompt once
      contents.push({
        role: "user",
        parts: [{ text: SYSTEM_PROMPT }]
      });

      // Add full chat history
      currentChat.forEach(msg => {
        contents.push({
          role: msg.role === 'user' ? 'user' : 'model',
          parts: [{ text: msg.text }]
        });
      });

      const res = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          contents: contents
        })
      });

      const data = await res.json();

      typing.remove();

      if (!res.ok || data.error) {
        const err = data.error?.message || "API Error";
        currentChat.push({ role: 'bot', text: "❌ " + err });
        renderMessages();
        return;
      }

      const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text;

      if (!reply) {
        currentChat.push({ role: 'bot', text: "❌ Empty response" });
        renderMessages();
        return;
      }

      // Add bot reply
      currentChat.push({ role: 'bot', text: reply });
      renderMessages();

    } catch (err) {
      typing.remove();
      currentChat.push({ role: 'bot', text: "❌ Network error" });
      renderMessages();
    }
  }

  // ================================
  // New Chat
  // ================================
  function newChat() {
    if (currentChat.length) chats.push([...currentChat]);
    currentChat = [];
    renderMessages();
    renderHistory();
  }

  // ================================
  // Chat History
  // ================================
  function renderHistory() {
    const box = document.getElementById('history');
    box.innerHTML = '';

    chats.forEach((chat, i) => {
      const div = document.createElement('div');
      div.innerText = 'Chat ' + (i + 1);
      div.onclick = () => {
        currentChat = [...chat];
        renderMessages();
      };
      box.appendChild(div);
    });
  }

  // ================================
  // Enter Key Support
  // ================================
  document.getElementById('input').addEventListener('keydown', e => {
    if (e.key === 'Enter') sendMsg();
  });
</script>


</body>
</html>
